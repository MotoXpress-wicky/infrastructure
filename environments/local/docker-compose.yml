name: motoxpress



networks:
  default:
    name: motoxpress-local-network

services:

  # =====================================================================
  # Helpers
  # =====================================================================

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./env/postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    env_file: ./env/redis.env
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3-management
    restart: unless-stopped
    env_file: ./env/rabbitmq.env
    ports:
      - "127.0.0.1:5672:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5


  # SeaweedFS (S3 API). start.sh starts the server, then creates the buckets and service users
  # listed in ./object-storage/. tr removes Windows line endings before the script runs.
  object-storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    env_file: ./env/object-storage.env
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /setup/start.sh > /tmp/start.sh && exec /bin/sh /tmp/start.sh"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - object-storage-data:/data
      - ./object-storage:/setup:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  nginx:
    image: nginxinc/nginx-unprivileged:stable   # Nginx as a non-root user, listening on 8080. TODO: pin a version tag
    restart: unless-stopped
    ports:
      - "80:8080"    # port 80 on this machine -> 8080 inside the container
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mailpit:
    image: axllent/mailpit:latest   
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"

  # =====================================================================
  # Services (no ports: the browser reaches them through Nginx)
  # =====================================================================

  user-service:
    image: ghcr.io/motoxpress-wicky/user-service:not-built-yet
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - ./env/user-service.env
      # Real Google and Gmail secrets (ignored by git). Loaded only if the file exists.
      - path: ./env/user-service.secrets.env
        required: false
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  product-service:
    image: ghcr.io/motoxpress-wicky/product-service:not-built-yet
    restart: unless-stopped
    expose:
      - "8081"
    env_file: ./env/product-service.env
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      object-storage: { condition: service_healthy }

  order-service:
    image: ghcr.io/motoxpress-wicky/order-service:not-built-yet
    restart: unless-stopped
    expose:
      - "8082"
    env_file: ./env/order-service.env
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      object-storage: { condition: service_healthy }
    extra_hosts:
      - "host.docker.internal:host-gateway"

  notification-service:
    image: ghcr.io/motoxpress-wicky/notification-service:not-built-yet
    restart: unless-stopped
    expose:
      - "8083"
    env_file: ./env/notification-service.env
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    volumes:
      # Real Firebase key (ignored by git). Download it into env/ before the first start.
      - ./env/firebase.json:/app/secrets/firebase.json:ro

  payment-service:
    image: ghcr.io/motoxpress-wicky/payment-service:not-built-yet
    restart: unless-stopped
    expose:
      - "8084"
    env_file: ./env/payment-service.env
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      object-storage: { condition: service_healthy }

  # React apps, built into small Nginx images that serve the static files as a non-root user, on port 8080.
  users-ui:
    image: ghcr.io/motoxpress-wicky/users-ui:not-built-yet
    restart: unless-stopped
    expose:
      - "8080"

  admin-ui:
    image: ghcr.io/motoxpress-wicky/admin-ui:not-built-yet
    restart: unless-stopped
    expose:
      - "8080"

volumes:
  postgres-data:
  rabbitmq-data:
  object-storage-data:
