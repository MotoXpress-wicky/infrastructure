map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's built-in DNS: lets Nginx find containers by name when a request arrives.
resolver 127.0.0.11 valid=10s ipv6=off;

# Customer site: http://localhost
server {
    listen 8080;
    server_name localhost;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite, never append: a client must not be able to fake its IP (rate limits).
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Request-Id      $request_id;

    client_max_body_size 10m;    # photo and PDF uploads

    include /etc/nginx/conf.d/api-routes.inc;
    include /etc/nginx/conf.d/media.inc;

    # users-ui container, or Vite (npm run dev) on port 3000 if the container is stopped.
    location / {
        set $u http://users-ui:8080;
        proxy_pass $u;
        error_page 502 504 = @users_ui_vite;
    }
    location @users_ui_vite {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host       $http_host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Admin site: http://admin.localhost
server {
    listen 8080;
    server_name admin.localhost;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Request-Id      $request_id;

    client_max_body_size 10m;

    include /etc/nginx/conf.d/api-routes.inc;
    include /etc/nginx/conf.d/media.inc;

    # admin-ui container, or Vite on port 3001 if the container is stopped.
    location / {
        set $u http://admin-ui:8080;
        proxy_pass $u;
        error_page 502 504 = @admin_ui_vite;
    }
    location @admin_ui_vite {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host       $http_host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# RabbitMQ management UI: http://rabbitmq.localhost (login from env/rabbitmq.env)
server {
    listen 8080;
    server_name rabbitmq.localhost;
    location / {
        set $u http://rabbitmq:15672;
        proxy_pass $u;
        proxy_set_header Host $http_host;
    }
}

# Mailpit inbox: http://mail.localhost (every email sent locally lands here)
server {
    listen 8080;
    server_name mail.localhost;
    location / {
        set $u http://mailpit:8025;
        proxy_pass $u;
        proxy_http_version 1.1;
        proxy_set_header Host       $http_host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
