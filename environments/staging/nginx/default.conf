# STAGING front door. Every request goes to a container (no IntelliJ fallback here).
# TODO: replace the example host names with the real staging domain, and add HTTPS
#       (Nginx + Certbot) when the staging VPS exists.

# Docker's built-in DNS: Nginx finds containers by name when a request arrives,
# so it starts even if one service is down (that service's paths answer 502).
resolver 127.0.0.11 valid=10s ipv6=off;

# Customer site
server {
    listen 8080;
    server_name staging.example.com;

    include /etc/nginx/conf.d/proxy-headers.inc;
    include /etc/nginx/conf.d/api-routes.inc;
    include /etc/nginx/conf.d/media.inc;

    location / { set $u http://users-ui:8080; proxy_pass $u; }
}

# Admin site
server {
    listen 8080;
    server_name admin.staging.example.com;

    include /etc/nginx/conf.d/proxy-headers.inc;
    include /etc/nginx/conf.d/api-routes.inc;
    include /etc/nginx/conf.d/media.inc;

    location / { set $u http://admin-ui:8080; proxy_pass $u; }
}
