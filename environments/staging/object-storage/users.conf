# One S3 user per service. Each may only read and write ITS OWN buckets.
# The keys come from env/object-storage.env: <PREFIX>_ACCESS_KEY and <PREFIX>_SECRET_KEY.
# The same two values go into that service's env file (S3_ACCESS_KEY, S3_SECRET_KEY).
#
# user                  prefix                 buckets (comma separated, no spaces)
user-service            USER_SERVICE           user-avatars
product-service         PRODUCT_SERVICE        product-media
order-service           ORDER_SERVICE          shipment-documents
payment-service         PAYMENT_SERVICE        courier-receipts
