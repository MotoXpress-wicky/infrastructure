map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Customer site: http://localhost
server {
    listen 80;
    server_name localhost;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    # $remote_addr overwrites the header. Do not use $proxy_add_x_forwarded_for here:
    # it keeps what the client sent, so a client could put a fake IP first and
    # dodge the rate limit. Nginx is the front door, so overwriting is correct.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Request-Id      $request_id;

    location /api/v1/user/        { proxy_pass http://host.docker.internal:8080; }
    location /oauth2/             { proxy_pass http://host.docker.internal:8080; }
    location /login/oauth2/       { proxy_pass http://host.docker.internal:8080; }
    location /api/v1/product/     { proxy_pass http://host.docker.internal:8081; }
    location /api/v1/order/       { proxy_pass http://host.docker.internal:8082; }
    location /api/v1/suggestion/  { proxy_pass http://host.docker.internal:8084; }
    # notification-service has no route on purpose. It is not public.

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host       $http_host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Admin site: http://localhost:8000
# Same API routes as the customer site. If you add a route above, add it here too.
server {
    listen 8000;
    server_name localhost;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    # $remote_addr overwrites the header. Do not use $proxy_add_x_forwarded_for here:
    # it keeps what the client sent, so a client could put a fake IP first and
    # dodge the rate limit. Nginx is the front door, so overwriting is correct.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Request-Id      $request_id;

    location /api/v1/user/        { proxy_pass http://host.docker.internal:8080; }
    location /oauth2/             { proxy_pass http://host.docker.internal:8080; }
    location /login/oauth2/       { proxy_pass http://host.docker.internal:8080; }
    location /api/v1/product/     { proxy_pass http://host.docker.internal:8081; }
    location /api/v1/order/       { proxy_pass http://host.docker.internal:8082; }
    location /api/v1/suggestion/  { proxy_pass http://host.docker.internal:8084; }

    location / {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host       $http_host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
